<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sonali's Handcrafts — Admin</title><link rel="stylesheet" href="style.css"><style>body{background:#f5f1e9}.admin{max-width:1100px;margin:auto;padding:32px 20px}.adminbar{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd6ca;padding-bottom:20px;margin-bottom:28px}.adminbar h1{font:600 34px Georgia;margin:0}.admin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.admin-card{background:#fffdfa;border:1px solid #ddd6ca;padding:24px}.admin-card b{font:600 30px Georgia}.admin-card small{display:block;color:#706b63;margin-top:5px}.admin-section{margin-top:28px;background:#fffdfa;border:1px solid #ddd6ca;padding:24px}.admin-section h2{font:600 25px Georgia}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form input,.form textarea{border:1px solid #ddd6ca;padding:12px;background:white;font:inherit}.form textarea{grid-column:1/-1;min-height:90px}.admin-btn{background:#171613;color:#fff;padding:12px 18px;font-weight:700;border:0}.status{margin-top:12px;color:#8b6a37}@media(max-width:700px){.admin-grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.form textarea{grid-column:auto}.adminbar{align-items:flex-start;gap:15px;flex-direction:column}}</style></head><body><main class="admin"><div class="adminbar"><div><p class="eyebrow">SONALI'S HANDCRAFTS</p><h1>Admin Panel</h1></div><button class="admin-btn" id="logout">Log out</button></div><section class="admin-grid"><div class="admin-card"><b id="productsCount">0</b><small>Products</small></div><div class="admin-card"><b id="ordersCount">0</b><small>Orders</small></div><div class="admin-card"><b id="usersCount">0</b><small>Customers</small></div></section><section class="admin-section"><h2>Add product</h2><form class="form" id="productForm"><input id="name" placeholder="Product name" required><input id="price" type="number" min="0" placeholder="Price (₹)" required><textarea id="description" placeholder="Product description" required></textarea><button class="admin-btn" type="submit">Add product</button></form><div class="status" id="status"></div></section></main><script type="module">import {auth,logout,onAuthStateChanged} from './auth.js';import {db} from './firebase.js';import {collection,addDoc,getDocs,serverTimestamp} from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';const ADMIN='ananynaik930@gmail.com';const status=document.getElementById('status');onAuthStateChanged(auth,async user=>{if(!user){location.href='index.html';return}if(user.email?.toLowerCase()!==ADMIN){document.querySelector('.admin').innerHTML='<div class="admin-card"><h1>Access denied</h1><p>This account is not authorized to access the admin panel.</p><a href="index.html">Return to store</a></div>';await logout();return}const [p,o,u]=await Promise.all([getDocs(collection(db,'products')),getDocs(collection(db,'orders')),getDocs(collection(db,'users'))]);productsCount.textContent=p.size;ordersCount.textContent=o.size;usersCount.textContent=u.size});document.getElementById('logout').onclick=()=>logout();document.getElementById('productForm').onsubmit=async e=>{e.preventDefault();try{await addDoc(collection(db,'products'),{name:name.value.trim(),price:Number(price.value),description:description.value.trim(),createdAt:serverTimestamp(),createdBy:auth.currentUser.uid});status.textContent='Product added successfully.';e.target.reset();productsCount.textContent=Number(productsCount.textContent)+1}catch(err){status.textContent='Could not add product: '+err.message}};</script></body></html>
